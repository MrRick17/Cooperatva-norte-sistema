<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Secretaría | Cooperativa Norte</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="body-panel">

    <header class="mobile-header">
        <div class="logo">
            <h2>Panel <span>Secretaría</span></h2>
        </div>
        <a href="index.html" style="color: white; text-decoration: none; font-size: 1.2rem;"><i class="fa-solid fa-right-from-bracket"></i></a>
    </header>

    <main class="main-content">
        <div class="top-section top-flex">
            <div class="header-titulos">
                <h1>Directorio de Afiliados</h1>
                <p class="subtitle">Busca clientes y reporta sus pagos para revisión</p>
            </div>
            <div class="acciones-top">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="buscador-clientes" placeholder="Buscar por nombre o cédula...">
                </div>
                <button class="btn-primario" id="btn-agregar-cliente-sec" style="background:#006412; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer; font-weight:bold; white-space:nowrap;"><i class="fa-solid fa-user-plus"></i> Nuevo Afiliado</button>
            </div>
        </div>

        <div class="afiliados-grid" id="clientes-grid">
        </div>

        <!-- Modal Reportar Pago -->
        <div class="modal-overlay" id="modal-pago" style="display: none; z-index: 2000;">
            <div class="modal-box" style="max-width: 480px;">
                <div class="modal-box__header">
                    <h3>Reportar Pago</h3>
                    <button class="btn-cerrar-modal" id="cerrar-modal-pago">&times;</button>
                </div>
                <div class="modal-box__body">
                    <p style="margin-bottom: 12px; font-size: 0.9rem; color: #4B5563;">
                        Afiliado: <strong id="pago-cliente-nombre" style="color: #1F2937;">-</strong>
                    </p>
                    <form id="form-pago" style="display: flex; flex-direction: column; gap: 12px;">
                        <input type="hidden" id="pago-cliente-id">
                        
                        <div class="form-row">
                            <div>
                                <label style="font-size:0.8rem; font-weight:bold; display:block; margin-bottom:4px; color:#1F2937;">Fecha Emisión (Ticket)</label>
                                <input type="date" id="pago-fecha-reporte" class="input-form" required>
                            </div>
                            <div>
                                <label style="font-size:0.8rem; font-weight:bold; display:block; margin-bottom:4px; color:#10B981;">Fecha Real del Pago</label>
                                <input type="date" id="pago-fecha-real" class="input-form" required>
                            </div>
                        </div>

                        <div>
                            <label style="font-size:0.8rem; font-weight:bold; display:block; margin-bottom:4px; color:#3B82F6;">Tasa del Día (Manual en Bs)</label>
                            <input type="number" id="pago-tasa-manual" step="0.01" placeholder="Ej: 41.50" class="input-form" style="border:2px solid #3B82F6;" required>
                        </div>

                        <div class="form-row">
                            <div>
                                <label style="font-size:0.8rem; font-weight:bold; display:block; margin-bottom:4px;">Monto USD ($)</label>
                                <input type="number" id="pago-monto-usd" step="0.01" placeholder="0.00" class="input-form" required>
                            </div>
                            <div>
                                <label style="font-size:0.8rem; font-weight:bold; display:block; margin-bottom:4px;">Monto Bs</label>
                                <input type="number" id="pago-monto-bs" step="0.01" placeholder="0.00" class="input-form" required>
                            </div>
                        </div>

                        <div>
                            <label style="font-size:0.8rem; font-weight:bold; display:block; margin-bottom:4px;">Meses a Pagar</label>
                            <input type="number" id="pago-meses" min="1" value="1" class="input-form" required>
                        </div>

                        <div>
                            <label style="font-size:0.8rem; font-weight:bold; display:block; margin-bottom:4px;">Método de Pago</label>
                            <select id="pago-metodo" class="input-form">
                                <option value="pago_movil">Pago Móvil</option>
                                <option value="transferencia">Transferencia Bancaria</option>
                                <option value="efectivo">Efectivo</option>
                            </select>
                        </div>

                        <div id="contenedor-referencia">
                            <label id="label-referencia" style="font-size:0.8rem; font-weight:bold; display:block; margin-bottom:4px;">Últimos 4 dígitos de Referencia</label>
                            <input type="text" id="pago-referencia" maxlength="4" placeholder="Ej: 4582" class="input-form" required>
                        </div>

                        <button type="submit" class="btn-primario" style="background: #006412; color: white;">Enviar a Revisión</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Modal Registrar Afiliado (Secretaría) -->
        <div class="modal-overlay" id="modal-cliente-sec" style="display: none; z-index: 2000;">
            <div class="modal-box" style="max-width: 550px;">
                <div class="modal-box__header">
                    <h3 style="color: #1F2937;"><i class="fa-solid fa-user-plus" style="color: #006412; margin-right: 8px;"></i>Registrar Afiliado</h3>
                    <button class="btn-cerrar-modal" id="cerrar-modal-cliente-sec">&times;</button>
                </div>
                <div class="modal-box__body">
                    <form id="form-cliente-sec" style="display: flex; flex-direction: column; gap: 15px;">
                        
                        <div class="form-row">
                            <div>
                                <label style="font-size:0.8rem; font-weight:bold; color:#374151; margin-bottom:5px; display:block;">Nombre Completo</label>
                                <div style="position: relative;">
                                    <i class="fa-solid fa-user" style="position: absolute; left: 12px; top: 12px; color: #9CA3AF;"></i>
                                    <input type="text" id="cli-nombre" placeholder="Ej: Juan Pérez" class="input-form" style="padding-left: 35px;" required>
                                </div>
                            </div>
                            <div>
                                <label style="font-size:0.8rem; font-weight:bold; color:#374151; margin-bottom:5px; display:block;">Cédula de Identidad</label>
                                <div style="position: relative;">
                                    <i class="fa-solid fa-id-card" style="position: absolute; left: 12px; top: 12px; color: #9CA3AF;"></i>
                                    <input type="text" id="cli-cedula" placeholder="Ej: V-12345678" class="input-form" style="padding-left: 35px;" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div>
                                <label style="font-size:0.8rem; font-weight:bold; color:#374151; margin-bottom:5px; display:block;">N° Asociado</label>
                                <div style="position: relative;">
                                    <i class="fa-solid fa-hashtag" style="position: absolute; left: 12px; top: 12px; color: #9CA3AF;"></i>
                                    <input type="text" id="cli-asociado" placeholder="Ej: 1025" class="input-form" style="padding-left: 35px;" required>
                                </div>
                            </div>
                            <div>
                                <label style="font-size:0.8rem; font-weight:bold; color:#374151; margin-bottom:5px; display:block;">Registro Funerario</label>
                                <div style="position: relative;">
                                    <i class="fa-solid fa-file-contract" style="position: absolute; left: 12px; top: 12px; color: #9CA3AF;"></i>
                                    <input type="text" id="cli-contrato" placeholder="Ej: 001-A" class="input-form" style="padding-left: 35px;" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div>
                                <label style="font-size:0.8rem; font-weight:bold; color:#374151; margin-bottom:5px; display:block;">Teléfono</label>
                                <div style="position: relative;">
                                    <i class="fa-solid fa-phone" style="position: absolute; left: 12px; top: 12px; color: #9CA3AF;"></i>
                                    <input type="text" id="cli-telefono" placeholder="Ej: 0414-1234567" class="input-form" style="padding-left: 35px;" required>
                                </div>
                            </div>
                            <div>
                                <label style="font-size:0.8rem; font-weight:bold; color:#374151; margin-bottom:5px; display:block;">Fecha de Vencimiento Inicial</label>
                                <div style="position: relative;">
                                    <i class="fa-solid fa-calendar" style="position: absolute; left: 12px; top: 12px; color: #9CA3AF;"></i>
                                    <input type="date" id="cli-vence" class="input-form" style="padding-left: 35px;" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div>
                                <label style="font-size:0.8rem; font-weight:bold; color:#374151; margin-bottom:5px; display:block;">¿Aporte Funerario?</label>
                                <select id="cli-funerario" class="input-form" style="font-weight: bold; color: #006412;">
                                    <option value="si">Sí (Aporte $5)</option>
                                    <option value="no">No (Aporte $0)</option>
                                </select>
                            </div>
                            <div>
                                <label style="font-size:0.8rem; font-weight:bold; color:#374151; margin-bottom:5px; display:block;">¿Incluye Cremación?</label>
                                <select id="cli-cremacion" class="input-form" style="font-weight: bold; color: #006412;">
                                    <option value="si">Sí (Aporte $7)</option>
                                    <option value="no">No (Aporte $2)</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn-primario" style="background:#006412; margin-top: 10px; border:none; padding:12px; border-radius:8px; color:white; font-weight:bold; cursor:pointer; font-size: 1rem;"><i class="fa-solid fa-floppy-disk" style="margin-right: 8px;"></i> Guardar Afiliado</button>
                    </form>
                </div>
            </div>
        </div>
        
    </main>

    <script src="usuario.js"></script>
</body>
</html>
