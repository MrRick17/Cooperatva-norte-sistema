<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Secretaría | Cooperativa Norte</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-panel">

    <header class="mobile-header">
        <div class="logo">
            <h2>Panel <span>Secretaría</span></h2>
        </div>
        <a href="index.html" style="color: white; text-decoration: none; font-size: 1.2rem;"><i class="fa-solid fa-right-from-bracket"></i></a>
    </header>

    <main class="main-content">
        <div class="top-section top-flex">
            <div class="header-titulos">
                <h1>Directorio de Afiliados</h1>
                <p class="subtitle">Busca clientes y reporta sus pagos para revisión</p>
            </div>
            <div class="acciones-top">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="buscador-clientes" placeholder="Buscar por nombre o cédula...">
                </div>
            </div>
        </div>

        <div class="afiliados-grid" id="clientes-grid">
            </div>

        <div class="modal-overlay" id="modal-pago" style="display: none;">
            <div class="modal-box">
                <div class="modal-box__header">
                    <h3>Reportar Pago</h3>
                    <button class="btn-cerrar-modal" id="cerrar-modal-pago">&times;</button>
                </div>
                <div class="modal-box__body">
                    <p style="margin-bottom: 15px; font-size: 0.9rem; color: #4B5563;">
                        Afiliado: <strong id="pago-cliente-nombre" style="color: #1F2937;">-</strong>
                    </p>
                    <form id="form-pago" style="display: flex; flex-direction: column; gap: 12px;">
                        <input type="hidden" id="pago-cliente-id">
                        
                        <div style="display: flex; gap: 10px;">
                            <div style="flex: 1;">
                                <label style="font-size:0.8rem; font-weight:bold; display:block; margin-bottom:4px;">Monto en Dólares ($)</label>
                                <input type="number" id="pago-monto-usd" step="0.01" placeholder="0.00" class="input-form" style="padding:10px;">
                            </div>
                            <div style="flex: 1;">
                                <label style="font-size:0.8rem; font-weight:bold; display:block; margin-bottom:4px;">Monto en Bolívares (Bs)</label>
                                <input type="number" id="pago-monto-bs" step="0.01" placeholder="0.00" class="input-form" style="padding:10px;">
                            </div>
                            
                        </div>

                        <div id="tasa-informativa-modal" style="font-size: 0.78rem; color: #006412; font-weight: 700; text-align: center; background: rgba(0, 100, 18, 0.05); padding: 6px; border-radius: 6px;">
                            Cargando tasa oficial...
                        </div>

                        <button type="submit" class="btn-primario" style="width: 100%; margin-top: 10px; justify-content: center; background: #006412; color: white;">Enviar a Revisión</button>
                    </form>
                </div>
            </div>
        </div>
        
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script src="usuario.js"></script>
</body>
</html>
