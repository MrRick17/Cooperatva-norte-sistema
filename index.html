<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooperativa Norte | Acceso al Sistema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        * { box-sizing: border-box !important; }
        input, select, button { max-width: 100% !important; }
    </style>
</head>
<body class="login-page">

    <main class="login-card">
        <div class="login-card__header">
            <div class="login-card__icon">
                <img src="Logo-Cooperativa.png" alt="Logo Cooperativa Norte" class="login-card__logo">
            </div>
            <h1 class="login-card__title">Cooperativa Norte</h1>
            <p class="login-card__subtitle">Asociación de Servicios Múltiples Norte, R.L.</p>
        </div>

        <form class="login-card__form" id="form-login">
            <div class="form-group">
                <label for="usuario" class="form-label">Usuario o Cédula</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="usuario" placeholder="Ej: V-12345678 o usuario" required class="form-input">
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="••••••••" required class="form-input">
                </div>
            </div>

            <p id="error-message" class="error-msg" style="display: none;"></p>

            <button type="submit" class="btn-login">
                <span>Ingresar al Sistema</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <div class="login-card__footer">
            <p>&copy; 2026 Cooperativa Norte, R.L. — Todos los derechos reservados.</p>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
